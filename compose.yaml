services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: incidencias-postgres
    environment:
      POSTGRES_DB: incidencias
      POSTGRES_USER: incidencias
      POSTGRES_PASSWORD: incidencias
    ports: ["5433:5432"]
    volumes: ["datos-incidencias:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidencias -d incidencias"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  datos-incidencias:
